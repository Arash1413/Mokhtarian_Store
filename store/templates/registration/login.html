{% extends "store/base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>ورود به حساب کاربری</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">ورود</button>
            </form>
            <p class="mt-3">
                حساب کاربری ندارید؟ <a href="{% url 'register' %}">ثبت‌نام کنید</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
