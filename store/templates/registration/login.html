{% extends "store/base.html" %}
{% load static %}

{% block content %}
<style>
    /* استایل‌های مشترک با صفحه ثبت نام برای هماهنگی */
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
    }
    .auth-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        background: #fff;
        overflow: hidden;
    }
    .auth-header {
        background: linear-gradient(45deg, #0d6efd, #0a58ca);
        color: white;
        padding: 2rem 1rem;
        text-align: center;
        border-bottom-left-radius: 50% 20px;
        border-bottom-right-radius: 50% 20px;
        margin-bottom: 1.5rem;
    }
    .form-control {
        border-radius: 10px;
        padding: 0.75rem 1rem;
        border: 1px solid #e1e1e1;
        background-color: #fcfcfc;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        border-color: #0d6efd;
        background-color: #fff;
    }
    .form-label {
        font-weight: 600;
        color: #444;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
    }
    .btn-auth {
        border-radius: 10px;
        padding: 0.8rem;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
        transition: transform 0.2s;
    }
    .btn-auth:hover {
        transform: translateY(-2px);
    }
    .field-icon {
        color: #0d6efd;
        margin-left: 5px;
    }
</style>

<div class="auth-container py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    
                    <!-- هدر کارت -->
                    <div class="auth-header">
                        <i class="bi bi-box-arrow-in-right" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2">ورود به حساب</h3>
                        <p class="small opacity-75 mb-0">خوش آمدید! لطفاً وارد شوید</p>
                    </div>

                    <div class="card-body p-4 pt-0">
                        <!-- نمایش خطاها -->
                        {% if form.errors %}
                            <div class="alert alert-danger rounded-3 shadow-sm d-flex align-items-center">
                                <i class="bi bi-exclamation-circle-fill fs-4 me-2"></i>
                                <div>
                                    نام کاربری یا رمز عبور اشتباه است.
                                </div>
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <!-- Input مخفی برای ریدایرکت بعد از لاگین -->
                            <input type="hidden" name="next" value="{{ next }}">

                            <div class="mb-4">
                                <label for="{{ form.username.id_for_label }}" class="form-label d-flex align-items-center">
                                    <i class="bi bi-person field-icon"></i> نام کاربری
                                </label>
                                <input type="text" name="username" id="{{ form.username.id_for_label }}" 
                                       class="form-control" placeholder="نام کاربری خود را وارد کنید..." required>
                            </div>

                            <div class="mb-4">
                                <label for="{{ form.password.id_for_label }}" class="form-label d-flex align-items-center">
                                    <i class="bi bi-key field-icon"></i> رمز عبور
                                </label>
                                <input type="password" name="password" id="{{ form.password.id_for_label }}" 
                                       class="form-control" placeholder="رمز عبور..." required>

                                <div class="text-end mt-2">
        <a href="{% url 'store:forgot_password' %}" class="text-decoration-none small text-muted">
            رمز عبور خود را فراموش کرده‌اید؟
        </a>
    </div>
                            </div>
                            
                            <div class="d-grid mt-5">
                                <button type="submit" class="btn btn-primary btn-auth fw-bold shadow">
                                    ورود به سایت
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-4 mb-3">
                            <span class="text-muted small">حساب کاربری ندارید؟</span>
                            <a href="{% url 'register' %}" class="text-decoration-none fw-bold ms-1 text-primary">
                                ثبت‌نام کنید <i class="bi bi-arrow-left-short align-middle"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
