{% extends "store/base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-center fw-bold mb-4">ورود به حساب کاربری</h2>
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            نام کاربری یا رمز عبور اشتباه است. لطفاً دوباره تلاش کنید.
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">نام کاربری</label>
                            <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control form-control-lg text-start" placeholder="نام کاربری...">
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label">رمز عبور</label>
                            <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control form-control-lg text-start" placeholder="رمز عبور...">
                        </div>
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">ورود</button>
                        </div>
                    </form>
                    <p class="mt-4 text-center">
                        حساب کاربری ندارید؟ <a href="{% url 'register' %}">ثبت‌نام کنید</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
