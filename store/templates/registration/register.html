{% extends "store/base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>ثبت‌نام در سایت</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">ثبت‌نام</button>
            </form>
            <p class="mt-3">
                قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'login' %}">وارد شوید</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
