{% extends "store/base.html" %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h2 class="fw-bold mt-3">تایید شماره موبایل</h2>
                        <p class="text-muted">
                            کد تایید برای شماره 
                            <span class="fw-bold text-dark" dir="ltr">{{ phone }}</span> 
                            ارسال شد.
                        </p>
                    </div>

                    <!-- فرم مخفی برای توکن CSRF -->
                    <form style="display: none;">{% csrf_token %}</form>

                    <!-- فرم دریافت کد -->
                    <form id="verify-form">
                        <div class="mb-4">
                            <label for="code" class="form-label text-muted small">کد ۶ رقمی را وارد کنید</label>
                            <input type="text" name="code" id="code" 
                                   class="form-control form-control-lg text-center tracking-widest" 
                                   placeholder="- - - - - -" 
                                   maxlength="6"
                                   inputmode="numeric" 
                                   pattern="\d*"
                                   required 
                                   autocomplete="one-time-code"
                                   style="letter-spacing: 10px; font-weight: bold;">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg fw-bold shadow-sm">
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                <span class="btn-text">تایید و پرداخت</span>
                            </button>
                            
                            <!-- دکمه بازگشت به چک‌اوت برای اصلاح شماره -->
                            <a href="{% url 'store:checkout' %}" class="btn btn-outline-secondary btn-sm mt-2">
                                اصلاح شماره موبایل
                            </a>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <button id="resend-btn" class="btn btn-link text-decoration-none text-muted p-0" disabled>
                            ارسال مجدد کد (<span id="timer">60</span>)
                        </button>
                    </div>

                    <!-- بخش نمایش پیام‌ها -->
                    <div id="message-area" class="mt-3"></div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const userPhone = "{{ phone }}"; // دریافت شماره از ویو جنگو
    const verifyForm = document.getElementById('verify-form');
    const messageArea = document.getElementById('message-area');
    const submitBtn = document.getElementById('submit-btn');
    const resendBtn = document.getElementById('resend-btn');
    const timerSpan = document.getElementById('timer');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    let countdownInterval;

    // تابع شروع تایمر
    function startTimer(duration) {
        let timer = duration, seconds;
        resendBtn.disabled = true;
        resendBtn.classList.add('text-muted');
        
        clearInterval(countdownInterval); // پاک کردن تایمر قبلی اگر وجود دارد

        countdownInterval = setInterval(function () {
            seconds = parseInt(timer % 60, 10);
            timerSpan.textContent = seconds;

            if (--timer < 0) {
                clearInterval(countdownInterval);
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-muted');
                resendBtn.classList.add('text-primary');
                resendBtn.innerHTML = 'ارسال مجدد کد';
            }
        }, 1000);
    }

    // تابع ارسال کد OTP
    function sendOTP() {
        messageArea.innerHTML = `<div class="alert alert-info py-2 small">در حال ارسال کد تایید...</div>`;
        
        const formData = new FormData();
        formData.append('phone', userPhone);

        fetch("{% url 'store:send_otp' %}", {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': csrfToken
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                messageArea.innerHTML = `<div class="alert alert-danger py-2 small">${data.error}</div>`;
            } else {
                messageArea.innerHTML = `<div class="alert alert-success py-2 small">کد تایید ارسال شد.</div>`;
                startTimer(60); // شروع تایمر 60 ثانیه‌ای
                document.getElementById('code').focus();
            }
        })
        .catch(err => {
            console.error(err);
            messageArea.innerHTML = `<div class="alert alert-danger py-2 small">خطا در ارتباط با سرور.</div>`;
        });
    }

    // ارسال خودکار کد به محض لود شدن صفحه
    sendOTP();

    // رویداد دکمه ارسال مجدد
    resendBtn.addEventListener('click', function(e) {
        e.preventDefault();
        sendOTP();
    });

    // رویداد تایید کد
    verifyForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // حالت لودینگ دکمه
        submitBtn.disabled = true;
        submitBtn.querySelector('.spinner-border').classList.remove('d-none');
        submitBtn.querySelector('.btn-text').textContent = 'در حال پردازش...';
        messageArea.innerHTML = '';

        const formData = new FormData(verifyForm);
        formData.append('phone', userPhone);

        fetch("{% url 'store:verify_otp' %}", {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': csrfToken
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                messageArea.innerHTML = `<div class="alert alert-success py-2 small">${data.message}</div>`;
                // هدایت به درگاه پرداخت
                setTimeout(() => {
                    window.location.href = data.redirect_url;
                }, 1000);
            } else {
                messageArea.innerHTML = `<div class="alert alert-danger py-2 small">${data.message}</div>`;
                // بازنشانی دکمه
                submitBtn.disabled = false;
                submitBtn.querySelector('.spinner-border').classList.add('d-none');
                submitBtn.querySelector('.btn-text').textContent = 'تایید و پرداخت';
            }
        })
        .catch(err => {
            console.error(err);
            messageArea.innerHTML = `<div class="alert alert-danger py-2 small">خطا در پردازش درخواست.</div>`;
            submitBtn.disabled = false;
            submitBtn.querySelector('.spinner-border').classList.add('d-none');
            submitBtn.querySelector('.btn-text').textContent = 'تایید و پرداخت';
        });
    });
});
</script>
{% endblock %}
