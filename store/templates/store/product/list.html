{% extends "store/base.html" %}

{% block content %}
<div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
    
    {% for product in products %}
    <div class="col mb-5">
        <div class="card h-100">
            <!-- Product image-->
            {% if product.image %}
                <img class="card-img-top" src="{{ product.image.url }}" alt="{{ product.name }}" />
            {% else %}
                <img class="card-img-top" src="https://via.placeholder.com/450x300.png?text=No+Image" alt="No image" />
            {% endif %}
            
            <!-- Product details-->
            <div class="card-body p-4">
                <div class="text-center">
                    <!-- Product name-->
                    <h5 class="fw-bolder">
                        <a href="{{ product.get_absolute_url }}">{{ product.name }}</a>
                    </h5>
                    <!-- Product price-->
                    {{ product.price }} تومان
                </div>
            </div>

            <!-- Product actions-->
            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                <div class="text-center">
                    <form action="{% url 'cart:cart_add' product.id %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-dark mt-auto">افزودن به سبد</button>
                    </form>
                </div>
            </div>
            <!-- div مربوط به card در اینجا بسته می‌شود -->
        </div>
        <!-- div مربوط به col در اینجا بسته می‌شود -->
    </div>
    {% endfor %}

</div>
{% endblock %}
