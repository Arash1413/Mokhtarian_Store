upstream django {
    server web:8000;
}

server {
    listen 80;

    server_name mokhtarianshop.ir www.mokhtarianshop.ir;

    # سرو کردن فایل‌های استاتیک
    location /static/ {
        alias /app/staticfiles/;
    }

    # سرو کردن فایل‌های مدیا (عکس محصولات)
    location /media/ {
        alias /app/media/;
    }

    # ارسال بقیه درخواست‌ها به جنگو (Gunicorn)
    location / {
         proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # این خط به جنگو می‌گوید که پروتکل اصلی https است
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; 
        
        proxy_redirect off;
    }
}