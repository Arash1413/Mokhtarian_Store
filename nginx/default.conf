upstream django {
    server web:8000;
}

server {
    listen 80;

    # سرو کردن فایل‌های استاتیک
    location /static/ {
        alias /app/staticfiles/;
    }

    # سرو کردن فایل‌های مدیا (عکس محصولات)
    location /media/ {
        alias /app/media/;
    }

    # ارسال بقیه درخواست‌ها به جنگو (Gunicorn)
    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}